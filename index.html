<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local PDF Watermark Tool</title>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #333; text-align: center; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
        }
        button {
            width: 100%; padding: 12px; background-color: #007bff; color: white;
            border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .status { margin-top: 15px; text-align: center; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

    <h2>PDF Watermark Tool</h2>

    <div class="control-group">
        <label for="pdfFile">1. Choose PDF File:</label>
        <input type="file" id="pdfFile" accept="application/pdf">
    </div>

    <div class="control-group">
        <label for="watermarkText">2. Watermark Text:</label>
        <input type="text" id="watermarkText" value="CONFIDENTIAL">
    </div>

    <div class="control-group">
        <label for="opacity">3. Opacity (0.1 to 1.0):</label>
        <input type="number" id="opacity" min="0.1" max="1.0" step="0.1" value="0.4">
    </div>

    <div class="control-group">
        <label for="rotation">4. Rotation Angle (Degrees):</label>
        <input type="number" id="rotation" value="45">
    </div>

    <button onclick="processPdf()">Apply Watermark & Download</button>

    <div id="status" class="status"></div>

    <script src="app.js"></script>
</body>
</html>
